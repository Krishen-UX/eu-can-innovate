<!doctype html>
<!-- Link preview image (Open Graph, 1200 x 630). Rendered to img/og-image.png by scripts/og.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --ink: #0D0D0D; --ink-2: #3A3A3A; --eu: #003399; --ca: #D81E27; --eu-soft: #C3D0E4; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #FFFFFF; color: var(--ink); position: relative; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-size: 17px; letter-spacing: 0.08em; text-transform: uppercase; }
  .top { position: absolute; left: 64px; right: 64px; top: 52px; border-top: 3px solid var(--ink); padding-top: 16px;
         display: flex; justify-content: space-between; color: var(--ink-2); }
  .comp { position: absolute; right: -80px; top: 112px; width: 740px; aspect-ratio: 794 / 430; }
  .comp img { position: absolute; left: 0; top: 15%; width: 100%; height: auto; }
  .field { position: absolute; mix-blend-mode: multiply; }
  .f-ca { background: var(--ca); top: 0; right: 8%; width: 34.8%; height: 67%; }
  .f-eu { background: var(--eu); bottom: 0; left: 8%; width: 33%; height: 66%; }
  .title { position: absolute; left: 64px; bottom: 132px; margin: 0; font-family: 'Manrope', sans-serif; font-weight: 200;
           font-size: 100px; line-height: 0.92; letter-spacing: -0.045em; }
  .title .eu { color: var(--eu); } .title .ca { color: var(--ca); }
  .sub { position: absolute; left: 64px; bottom: 60px; width: 470px; border-top: 2px solid var(--eu); padding-top: 14px;
         font-family: 'Manrope', sans-serif; font-weight: 300; font-size: 27px; letter-spacing: -0.01em; color: var(--eu); }
  .url { position: absolute; right: 64px; bottom: 64px; color: var(--ink-2); }
</style>
</head>
<body>
  <div class="top mono"><span>Concept note</span><span>Independent initiative</span><span>Seeking partners</span></div>
  <div class="comp">
    <img src="../img/cover-hands.png" alt="">
    <div class="field f-ca"></div>
    <div class="field f-eu"></div>
  </div>
  <h1 class="title"><span class="eu">EU</span> <span class="ca">CAN</span><br>INNOVATE</h1>
  <div class="sub">EU-Canada Digital Bridge Hackathon</div>
  <div class="url mono">eucaninnovate.eu</div>
</body>
</html>
