# EU CAN Innovate: every text on the website AND in the printable concept note (PDF).
#
# How to edit
# - Change the text here, then commit to main (on github.com: pencil icon, "Commit changes").
# - Vercel rebuilds the website from this file.
# - A GitHub Action renders a new PDF from the same file and commits it, so the download
#   on the website is always up to date. The print version is also visible at /print.html.
#
# Conventions
# - Headlines: one line per row. The PDF keeps these line breaks, the website flows them.
# - Where web and print need different wording, a field has `web:` and `print:` variants.
#   If you change one, check whether the other should change too.
# - Links inside a paragraph: [link text](https://example.com)
# - The PDF pages have a fixed A4 size. If a text gets much longer, check the PDF afterwards.

